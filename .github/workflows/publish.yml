name: Publish SaJIT to crates.io

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish

    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
